<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>{{ plugin_name }}</title>
  <!-- Mantle UI contract: docs/design/plugin-ui-system.md -->
  <style>
    :root {
      --hearth-bg: #0f1115;
      --hearth-surface: #161a22;
      --hearth-fg: #e6e6e6;
      --hearth-muted: #9aa3b2;
      --hearth-accent: #ff6a3d;
      --hearth-accent-fg: #0f1115;
      --hearth-error: #ef4444;
      --hearth-radius-sm: 4px;
      --hearth-radius-md: 8px;
      --hearth-radius-lg: 16px;
      --hearth-font-sans: -apple-system, Inter, system-ui, sans-serif;
      --hearth-safe-top: env(safe-area-inset-top);
      --hearth-safe-bottom: env(safe-area-inset-bottom);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --hearth-bg: #fafafa;
        --hearth-surface: #ffffff;
        --hearth-fg: #111111;
        --hearth-muted: #6b7280;
        --hearth-accent: #ff6a3d;
        --hearth-accent-fg: #ffffff;
        --hearth-error: #b91c1c;
      }
    }
    body {
      margin: 0;
      background: var(--hearth-bg);
      color: var(--hearth-fg);
      font-family: var(--hearth-font-sans);
      padding: calc(var(--hearth-safe-top, 0px) + 16px) 16px
        calc(var(--hearth-safe-bottom, 0px) + 16px);
      max-width: 480px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { color: var(--hearth-muted); margin: 0; line-height: 1.5; }
    a { color: var(--hearth-accent); }
  </style>
</head>
<body>
  <h1>{{ plugin_name }}</h1>
  <p>
    Mantle-aligned plugin shell.
    See
    <a href="https://github.com/mcelhennyi/kindling/blob/main/docs/design/plugin-ui-system.md">plugin-ui-system.md</a>.
  </p>
  <script>
    // Theme listener — mirrors @kindling/mantle/vanilla/theme (origin-gated).
    window.addEventListener("message", (e) => {
      if (e.origin !== window.location.origin) return;
      const m = e.data;
      if (!m || typeof m.type !== "string" || !m.type.startsWith("hearth.")) return;
      if (m.type !== "hearth.theme") return;
      const tokens = m.tokens || {};
      for (const [k, v] of Object.entries(tokens)) {
        if (typeof k === "string" && k.startsWith("--hearth-") && v != null) {
          document.documentElement.style.setProperty(k, String(v));
        }
      }
      const bg = tokens["--hearth-bg"] || getComputedStyle(document.documentElement)
        .getPropertyValue("--hearth-bg").trim();
      let meta = document.querySelector('meta[name="theme-color"]:not([media])');
      if (!meta) {
        meta = document.createElement("meta");
        meta.setAttribute("name", "theme-color");
        document.head.appendChild(meta);
      }
      if (bg) meta.setAttribute("content", bg);
    });
    fetch("/health")
      .then((r) => r.json())
      .then((d) => console.log("plugin health:", d))
      .catch(() => {});
  </script>
</body>
</html>
